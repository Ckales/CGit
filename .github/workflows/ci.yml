name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter 检查与构建
        working-directory: flutter_ui
        run: flutter analyze && flutter test && flutter build macos --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter 检查与构建
        working-directory: flutter_ui
        run: flutter analyze && flutter test && flutter build windows --release
      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 安装失败' }
          }
      - name: 制作 Windows 安装包
        shell: pwsh
        run: ./flutter_ui/tool/package_windows.ps1
      - name: 验证安装、重复安装与卸载
        shell: pwsh
        run: ./flutter_ui/tool/test_windows_installer.ps1 -Installer (Get-Item dist/*-Setup.exe).FullName
