[package]
name = "cgit"
version = "0.1.0"
description = "A lightweight Git desktop client for macOS"
authors = ["Ckales"]
license = "MIT"
repository = "https://github.com/Ckales/CGit"
edition = "2021"
rust-version = "1.95"

[lib]
name = "cgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha", features = [] }
# v3: the webview runtime is a crate you depend on and hand to Builder::runtime,
# not a feature of `tauri`. wry is the system-webview one — same engine as v2.
tauri-runtime-wry = "3.0.0-alpha"
tauri-plugin-dialog = "3.0.0-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gix = { version = "0.87", features = ["blame", "status", "parallel", "max-performance"] }
notify = "6"
